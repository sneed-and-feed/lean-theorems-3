version: "v0.4"

project:
  name: "The Expander Mixing Lemma and Spectral Discrepancy"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of the Expander Mixing Lemma (Alon–Chung 1988)
    and its spectral combinatorial consequences for regular graphs. Proves the sharp eigenvalue
    bound on edge discrepancy |e(S, T) - d|S||T|/n| <= \lambda \sqrt{|S|(1-|S|/n)|T|(1-|T|/n)},
    the simplified \lambda \sqrt{|S||T|} bound, the Hoffman–Alon independence number bound
    \alpha(G) <= \lambda n / (d + \lambda), the chromatic number lower bound \chi(G) >= 1 + d/\lambda,
    and the positive edge density threshold for large vertex subsets. To the maintainers' knowledge,
    the theorem was not found in an exact declaration name, docstring, and type signature search of
    the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C50", "05C80", "15A18"]

