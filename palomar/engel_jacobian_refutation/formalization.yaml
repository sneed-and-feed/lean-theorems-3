version: "v0.4"

project:
  name: "Vitushkin's Refutation of Engel's Jacobian Paper"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of Anatoly G. Vitushkin's 1973/1975 algebraic obstruction
    and refutation of Wolfgang Engel's 1955 paper on the 2D Jacobian Conjecture. Engel claimed that any
    polynomial automorphism pair (P, Q) with constant non-zero Jacobian determinant can be triangularly
    degree-reduced to linear coordinates via elementary Cremona shears P - c Q^k. Vitushkin proved that
    in the presence of cross-terms, polynomial pairs develop non-vanishing obstruction terms in their
    Jacobian determinant that prevent elementary triangular reduction without non-trivial algebraic cancellations.
    The suite formalizes the 2D Jacobian determinant over ℂ[X, Y], preservation under elementary shears,
    the exact shear defect formulas, and Vitushkin's explicit non-invariance certificate.

