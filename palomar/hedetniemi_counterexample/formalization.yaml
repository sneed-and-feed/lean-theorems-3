version: "v0.4"

project:
  name: "Shitov's Counterexample to Hedetniemi's Conjecture"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    Machine-checked Lean 4 formalization of Yaroslav Shitov's structural disproof of
    Hedetniemi's conjecture (Annals of Mathematics 190, 2019, 663–667). Formalizes
    categorical tensor products of graphs, canonical homomorphisms, exponential graphs
    (El-Zahar & Sauer 1985), canonical evaluation colorings, and Shitov's reduction
    establishing that counterexample pairs strictly violate Hedetniemi's chromatic formula.

classification:
  arxiv: [math.CO]
  msc2020: ["05C15", "05C76"]

sources:
  - title: "Counterexamples to Hedetniemi's conjecture"
    type: paper
    authors:
      - "Yaroslav Shitov"
    venue: "Annals of Mathematics 190 (2019), 663–667"
    year: 2019
    relationship: formalizes
  - title: "The chromatic number of the product of two 4-chromatic graphs is 4"
    type: paper
    authors:
      - "Mohamed El-Zahar"
      - "Norbert Sauer"
    venue: "Combinatorica 5 (1985), 121–126"
    year: 1985
    relationship: adapts
    note: >-
      Foundational construction of exponential graphs and evaluation colorings for categorical products.

related_formalizations: []

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (:= sorry) with synchronized AST signatures.
    Solution verified with 0 sorries, 0 custom axioms, and 0 warnings.
