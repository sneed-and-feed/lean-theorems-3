version: "v0.4"

project:
  name: "Brieskorn Manifolds, Topological Spheres, and the 28 Exotic 7-Spheres"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Egbert Brieskorn's 1966 theory of
    singularity links Sigma(a_1, ..., a_n), the Brieskorn–Hirzebruch sphere criterion, the 28
    Milnor–Kervaire exotic 7-spheres generated by the family Sigma(2, 2, 2, 3, 6k-1) in C^5
    surjecting onto Theta_7 = Z/28Z, and the Milnor fiber signature formula for the Casson
    invariants of Brieskorn homology 3-spheres with certified evaluations for Sigma(2,3,5),
    Sigma(2,3,7), Sigma(2,3,11), and Sigma(2,5,7). To the maintainers' knowledge, the theorem
    was verified absent from the core Mathlib library (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.GT, math.AG, math.DG]
  msc2020: ["57R55", "57R60", "32S25", "57M27"]

sources:
  - title: "Beispiele differenzierbarer Mannigfaltigkeiten, die algebraische Mannigfaltigkeiten sind"
    type: paper
    authors:
      - "Egbert Brieskorn"
    year: 1966
    venue: "Inventiones Mathematicae, 2(1), 1-14"
    relationship: formalizes
  - title: "Singular points of complex hypersurfaces"
    type: book
    authors:
      - "John Milnor"
    year: 1968
    venue: "Annals of Mathematics Studies, No. 61, Princeton University Press"
    relationship: adapts
    note: >-
      Formalization adapts Milnor's fibration theorem and signature formula for isolated hypersurface
      singularities to compute Casson invariants of Brieskorn spheres.
  - title: "Groups of homotopy spheres: I"
    type: paper
    authors:
      - "Michel A. Kervaire"
      - "John W. Milnor"
    year: 1963
    venue: "Annals of Mathematics, 77(3), 504-537"
    relationship: background

related_formalizations: []

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    maintainer audit with 0 errors, 0 sorries, and strictly standard kernel axioms.
