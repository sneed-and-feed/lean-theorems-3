version: "v0.4"

project:
  name: "The Kelley–Meka Theorem: Strong Bounds for 3-Progressions"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of the breakthrough theorem of
    Zander Kelley and Raghu Meka (2023) establishing quasi-polynomial upper bounds
    r_3(N) <= C N exp(-c (log N)^(1/12)) on 3-term arithmetic progression free sets.
    Formalizes Bohr set geometry, relative density bounds, spectral concentration,
    additive and multiplicative density boost accumulation, dimension/rank growth bounds,
    and asymptotic comparison against Roth's (1953) and Bourgain's (1999) rates, with
    certified concrete numerical bounds for N = 10^6, 2^64, and 10^100.
    To the maintainers' knowledge, the theorem and spectral Bohr increment bounds
    were verified absent from the core Mathlib library (checked against Mathlib v4.34.0-rc1).

classification:
