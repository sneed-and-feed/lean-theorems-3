version: "v0.4"

project:
  name: "Kelley–Meka Density Increment Dynamics, Bohr Regularity & Constant Calibration"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    Machine-checked Lean 4 formalization of the quantitative infrastructure and Bohr set dynamics
    underlying the Kelley–Meka (2023) density increment approach for 3-term arithmetic progressions.
    Formalizes Bohr set regularity, relative density bounds, additive and multiplicative density boost
    accumulation dynamics, cumulative rank growth bounds, quasi-polynomial rate comparisons against
    Roth's (1953) and Bourgain's (1999) rates, and certified numerical constant evaluations at scales
    N = 10^6, 2^64, and 10^100. Truthfully discloses that the unconditional global density bound
    r_3(N) <= C N exp(-c (log N)^(1/12)) remains a target scaffold, while all Bohr set regularity,
    density increment dynamics, and quantitative constant calibration theorems are fully verified.

