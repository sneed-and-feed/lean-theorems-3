version: "v0.4"

project:
  name: "The Alon–Boppana Spectral Bound and Ramanujan Expanders"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of the foundations of the Alon–Boppana spectral lower bound
    (Alon 1986, Nilli 1991) and Ramanujan expander graphs. Formalizes the metric spherical shell
    decomposition of regular graphs, Nilli's radial geometric profile g(k) = (d-1)^{-k/2}, the balanced
    orthogonal linear combinations of localized test functions, and the optimal spectral gap
    d - \lambda_2 >= d - 2\sqrt{d-1} for Ramanujan graphs. To the maintainers' knowledge, the theorem
    was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib
    revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C50", "05C12", "15A18"]

sources:
  - title: "Eigenvalues and expanders"
    type: paper
    authors:
      - "Noga Alon"
    venue: "Theory of Computing Systems"
    year: 1986
    relationship: formalizes
  - title: "On the second eigenvalue of a graph"
    type: paper
    authors:
      - "Alon Nilli"
    venue: "Discrete Mathematics"
    year: 1991
    relationship: adapts
    note: >-
      Formalization adapts Nilli's short topological and distance-partition Rayleigh quotient method to
      establish the Alon–Boppana second eigenvalue lower bound.
  - title: "Ramanujan graphs"
    type: paper
    authors:
      - "Alexander Lubotzky"
      - "Ralph Phillips"
      - "Peter Sarnak"
    venue: "Combinatorica"
    year: 1988
    relationship: background

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Combinatorics/SimpleGraph/Metric.lean"
    relationship: builds-on
    note: >-
      Formalization builds on Mathlib's graph metric library, extending distance and neighborhood
      partitions to spherical shell decompositions and Nilli test functions.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
