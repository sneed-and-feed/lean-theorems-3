version: "v0.4"

project:
  name: "Tanner's Vertex Expansion Bound for Regular Graphs"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Tanner's Vertex Expansion Bound (R. Michael Tanner, 1984),
    a fundamental theorem in spectral graph theory and coding theory establishing a quantitative lower bound
    on the open neighborhood size |N(S)| of subsets in a d-regular graph in terms of the second eigenvalue
    \lambda(G). Includes Cauchy–Schwarz neighborhood estimation, orthogonal spectral decomposition of the
    indicator vector, the small-set expansion asymptotic bound, optimal expansion in Ramanujan graphs,
    and the vertex expansion margin bound |N(S)| - |S| >= (d^2 - \lambda^2)/(d^2 + \lambda^2) |S| for sets
    of relative size at most 1/2. To the maintainers' knowledge, the theorem was not found in an exact declaration
    name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

