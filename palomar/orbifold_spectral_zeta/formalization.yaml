version: "v0.4"

project:
  name: "Hyperbolic Orbifold Spectral Zeta, Gauss–Bonnet Area, and the Selberg Trace Formula"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of the spectral geometry of 1-cusped hyperbolic
    2-orbifolds O(p, q, infty) = Delta(p, q, infty) \ H. Proves Gauss–Bonnet area formulas
    Area(O) = 2 pi (1 - 1/p - 1/q), certified exact areas for canonical triangle signatures
    ((3,4,infty), (2,3,infty), (2,5,infty), (3,5,infty)), Eisenstein series scattering determinant
    properties (functional equation, unitarity on critical line Re(s)=1/2, residue product formula),
    the Orbifold Selberg Trace Formula decomposing discrete cusp forms, Eisenstein integrals, and geometric
    conjugacy classes, and the Selberg zeta function. To the maintainers' knowledge, the theorem
    was verified absent from the core Mathlib library (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.SP, math.NT, math.DG]
  msc2020: ["11F72", "58J50", "30F35", "11M36"]

sources:
  - title: "Harmonic analysis on hyperbolic spaces and Selberg's trace formula"
    type: book
    authors:
      - "Dennis A. Hejhal"
    year: 1983
    venue: "Lecture Notes in Mathematics, Vol. 1001, Springer-Verlag"
    relationship: formalizes
  - title: "Harmonic analysis and discontinuous groups in weakly symmetric Riemannian spaces with applications to Dirichlet series"
    type: paper
    authors:
      - "Atle Selberg"
    year: 1956
    venue: "Journal of the Indian Mathematical Society, 20, 47-87"
    relationship: adapts
    note: >-
      Formalization adapts Selberg's trace formula to 1-cusped hyperbolic 2-orbifolds, decomposing the
      spectrum into discrete cusp forms and Eisenstein integrals.
  - title: "Spectral theory of the Riemann zeta-function"
    type: book
    authors:
      - "Yoichi Motohashi"
    year: 1997
    venue: "Cambridge Tracts in Mathematics, Vol. 127, Cambridge University Press"
    relationship: background

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Analysis/SpecialFunctions/Trigonometric/Basic.lean"
    relationship: builds-on
    note: >-
      Formalization builds on Mathlib's real and complex analysis libraries and extends them with
      hyperbolic orbifold spectral geometry, Gauss–Bonnet area formulas, Eisenstein scattering
      determinants, and Selberg trace formulas.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    maintainer audit with 0 errors, 0 sorries, and strictly standard kernel axioms.
