version: "v0.4"

project:
  name: "Gilmer's Information-Theoretic Entropy Mechanics for Union-Closed Sets"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    Machine-checked Lean 4 formalization of Justin Gilmer's (2022) information-theoretic entropy framework
    for Frankl's Union-Closed Sets Conjecture (1979). Formalizes the algebraic properties of Gilmer's
    golden ratio threshold c_0 = (3 - sqrt(5))/2, binary and natural entropy symmetry, the golden-ratio
    fixed-point relation H(2 c_0 - c_0^2) = H(c_0), entropy domination on [0, c_0], and certified
    frequency lower bounds for concrete union-closed families (two-element pairs and finite powersets).
    Truthfully discloses that the universal conjecture GilmerTheoremStatement remains an unproven Prop definition,
    while all information-theoretic, algebraic, and concrete family bounds are fully verified.

classification:
  arxiv: [math.CO, cs.IT]
  msc2020: ["05D05", "94A17", "06A07"]

sources:
  - title: "A constant lower bound for the union-closed sets conjecture"
    type: preprint
    authors:
      - "Justin Gilmer"
    year: 2022
    venue: "arXiv:2211.09055"
    relationship: adapts
    note: >-
      Formalizes Gilmer's information-theoretic entropy framework, golden-ratio fixed-point mechanics
      (H(2 c_0 - c_0^2) = H(c_0)), entropy domination on [0, c_0], and certified frequency bounds on concrete
      families, while isolating the universal conjecture statement.
  - title: "Approximate Frankl's conjecture for union-closed families"
    type: preprint
    authors:
      - "Zachary Chase"
      - "Shachar Lovett"
    year: 2022
    venue: "arXiv:2211.11689"
    relationship: background
  - title: "Extremal set systems"
    type: paper
    authors:
      - "Péter Frankl"
    year: 1979
    venue: "Finite and Infinite Sets, Colloq. Math. Soc. János Bolyai, Vol. 37, 305-318"
    relationship: background

related_formalizations: []

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    maintainer audit with 0 errors, 0 sorries, and strictly standard kernel axioms.
