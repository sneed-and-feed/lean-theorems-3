version: "v0.4"

project:
  name: "Jenrich–Brouwer 64-Dimensional Counterexample to Borsuk's Conjecture"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Thomas Jenrich and Andries E. Brouwer's
    64-dimensional two-distance counterexample to Borsuk's conjecture (2014), building on Andriy V.
    Bondarenko's 65-dimensional construction (2013). The formalization establishes the metric and
    combinatorial foundations (clique-diameter lemma, pigeonhole cover bound), the Euclidean representation
    of the Suzuki strongly regular graph G₂(4) = srg(416, 100, 36, 20) with spectrum {100, 20, -4} and
    eigenspace dimensions {1, 65, 350}, Jenrich's reduction vector p = 1_{B₂} - 1_{B₃} yielding orthogonality
    on the 352-vertex carrier S₆₄ = C ∪ B₁, the codimension reduction to dimension 64, and the partition
    lower bound requiring at least 71 parts of smaller diameter, strictly exceeding 64 + 1 = 65.
    Additionally formalizes Jenrich's secondary reduction vector q = 2 * 1_{B₁} - 1_{B₂} - 1_{B₃},
    establishing the 63-dimensional extremal tightness on the 320-vertex carrier C (which achieves
    the Borsuk partition number 64 = 63 + 1) and proving the vertex augmentation obstruction:
    ⟨q, y v⟩ ≠ 0 for every v ∉ C, so no vertex outside C can be adjoined while remaining within the
    63-dimensional hyperplane orthogonal to q.

